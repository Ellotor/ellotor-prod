<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Ride</title>

<style>
    body {
        font-family: Arial;
        background: #f4f4f4;
    }

    .container {
        max-width: 500px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
    }

    button {
        padding: 12px 20px;
        font-size: 16px;
    }

    .start-btn {
        background: #28a745;
        color: white;
        width: 100%;
        margin-top: 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .start-btn:disabled {
        background: #999;
        cursor: not-allowed;
    }

    .ride-card {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 15px;
        margin-top: 15px;
    }

    .ride-card p {
        margin: 8px 0;
    }

    .warning {
        color: red;
        font-weight: bold;
        margin-top: 10px;
    }

    .success {
        color: green;
        font-weight: bold;
        margin-top: 10px;
    }
</style>

</head>

<body>

<div class="container">

    <button onclick="history.back()">⬅ Back</button>

    <h1>Start Current Ride</h1>

    <div id="ride-info">
        Loading...
    </div>

    <button
        id="start-btn"
        class="start-btn"
        onclick="startRide()">
        Start Ride Now
    </button>

</div>

<script>

async function loadRide() {

    try {

        const res = await fetch('/train/currentRide');

        if (!res.ok) {
            throw new Error("Unable to load ride");
        }

        const ride = await res.json();

        let statusMessage = '';

        if ((ride.bookedSeats || 0) === 0) {

            statusMessage =
                `<p class="warning">
                    Cannot start ride until at least 1 seat is booked.
                </p>`;

        } else if (ride.status === 'Started') {

            statusMessage =
                `<p class="success">
                    Ride is currently running.
                </p>`;
        }

        document.getElementById('ride-info').innerHTML = `
            <div class="ride-card">

                <p>
                    <strong>Ride No:</strong>
                    ${ride.rideNo}
                </p>

                <p>
                    <strong>Total Seats Booked:</strong>
                    ${ride.bookedSeats || 0}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${ride.status}
                </p>

                <p>
                    <strong>Start Time:</strong>
                    ${
                        ride.startTime
                        ? new Date(ride.startTime).toLocaleString()
                        : 'Not Started'
                    }
                </p>

                ${statusMessage}

            </div>
        `;

        const startBtn =
            document.getElementById('start-btn');

        if (ride.status === 'Started') {

            startBtn.disabled = true;
            startBtn.innerText = 'Ride Already Started';

        }
        else if ((ride.bookedSeats || 0) === 0) {

            startBtn.disabled = true;
            startBtn.innerText = 'No Bookings Yet';

        }
        else {

            startBtn.disabled = false;
            startBtn.innerText = 'Start Ride Now';
        }

    } catch (err) {

        console.error(err);

        document.getElementById('ride-info').innerHTML =
            '<p style="color:red;">Unable to load current ride.</p>';
    }
}

async function startRide() {

    try {

        const res = await fetch('/train/startRide', {
            method: 'PUT'
        });

        const data = await res.json();

        alert(data.message);

        if (data.success) {
            loadRide();
        }

    } catch (err) {

        console.error(err);

        alert('Failed to start ride.');
    }
}

loadRide();

setInterval(loadRide, 5000);

</script>

</body>
</html>
